title: PHP2SHELL Upload-Progress / Cookie-less PHPSESSID Injection (request body)
id: 9f0e1d2c-3b4a-4958-a6b7-c8d9e0f1a2b3
status: experimental
description: |
    Detects the php2shell request shape (CVE-2026-109618 / CVE-2026-109619) in
    captured HTTP request bodies: a multipart POST carrying the server-fixed
    upload-progress field name, optionally with PHPSESSID as a form field and no
    Cookie header (cookie-less session-ID injection), or the nested empty-file
    flood used to trigger the OOM.

    DATA SOURCE: this rule needs request-BODY logging. Standard access logs do
    not capture it. Feed one of: ModSecurity audit log (parts C/I), a WAF that
    logs matched bodies, or an HTTP sensor (Zeek with body extraction). Field
    names below assume a normalized body field `request_body`; adjust to your
    pipeline (e.g. modsec `message`/`data`, waf `http.request.body`).

    The upload-progress field name is set by server ini (session.upload_progress.name,
    default PHP_SESSION_UPLOAD_PROGRESS) and the attacker cannot rename it against
    a default target, so this is high-fidelity and evasion-resistant. Do NOT narrow
    it with PoC boundaries/User-Agents — those are attacker-controlled cosmetics.
references:
    - https://calif.io/php2shell/
author: php2shell detections
date: 2026/10/24
tags:
    - attack.initial_access
    - attack.t1190
    - attack.t1659
    - cve.2026.109618
    - cve.2026.109619
logsource:
    category: webserver
detection:
    is_multipart:
        content_type|contains: 'multipart/form-data'
    http_method:
        method: 'POST'
    progress_field:
        request_body|contains: 'name="PHP_SESSION_UPLOAD_PROGRESS"'
    sid_form_field:
        request_body|contains: 'name="PHPSESSID"'
    has_cookie_header:
        # cookies are usually logged as their own field; cookie-less injection
        # means this field is absent/empty
        cookie|contains: 'PHPSESSID'
    nested_flood:
        request_body|re: 'name="files\d+(\[[a-z]+\]){2,}'
    empty_filename:
        request_body|contains: 'filename=""'
    condition: http_method and is_multipart and progress_field and ( sid_form_field and not has_cookie_header or nested_flood and empty_filename )
fields:
    - src_ip
    - request_uri
    - http_user_agent
falsepositives:
    - Apps that legitimately use session.upload_progress for progress bars will
      send the progress field — but almost never cookie-less, and never with the
      nested empty-file flood. Baseline the legit callers and allowlist them.
level: high
