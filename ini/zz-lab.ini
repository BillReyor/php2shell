; php2shell demo — LAB config (mirrors 19h's verified test setup).
;
; Three NON-STOCK settings, each chosen to make a primitive easy to observe:
;   max_multipart_body_parts=4   stock is -1 (unlimited); 4 makes the parse
;                                bail reachable with just 5 parts (P3)
;   session.upload_progress.min_freq=0   stock is 1; 0 makes progress updates
;                                deterministic for small/fast uploads (P2)
;   session.upload_progress.cleanup=0    stock is On; Off keeps the progress
;                                key in the saved session file (easier evidence)
;
; NOTE: session.upload_progress.enabled stays ON — the stock default. That is
; the vulnerability; do not "fix" it here or the demo stops demonstrating.

max_multipart_body_parts=4
session.upload_progress.min_freq=0
session.upload_progress.cleanup=0
